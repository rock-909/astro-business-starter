# Dependabot version updates. CI validates each pull request it opens.
# Security updates are enabled in the repository settings, not in this file;
# Dependabot's default 3-day cooldown applies only to version updates and does
# not delay security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Routine minor/patch bumps arrive as one PR; major bumps stay separate.
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript stays on 6.x; see the TypeScript exception in
      # .claude/rules/dependencies.md. Remove this together with that exception.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
