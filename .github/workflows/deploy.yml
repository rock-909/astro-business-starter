name: Deploy

# Manual only. preview deploys the separate "<name>-preview" Worker (wrangler.jsonc
# env.preview); production deploys the top-level Worker, only from main, only after CI
# passed on that commit and only past the production readiness gate. Then both check the
# live site without sending an inquiry. Setup and what a pass proves: LAUNCH.md section 3.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read
  # Read the CI result of the commit being deployed to production.
  actions: read

concurrency:
  group: deploy-${{ inputs.environment }}
  # Never stop a deploy halfway; a second run waits for the first.
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The GitHub Environment of the same name holds this target's secrets and variables
    # and its protection rules (production: main only).
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_SITE_URL }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Production deploys only main
        if: inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deploys only from main, not ${GITHUB_REF_NAME}." >&2
          exit 1

      - name: Production deploys only a commit that passed CI
        if: inputs.environment == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          if [ "$conclusion" != success ]; then
            echo "CI on main for ${GITHUB_SHA} is '${conclusion:-not found}', not success." >&2
            exit 1
          fi

      - name: Check required settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PUBLIC_SITE_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "The ${DEPLOY_ENVIRONMENT} GitHub Environment is missing:${missing} (LAUNCH.md section 3)." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same exact Node as ci.yml (.claude/rules/dependencies.md).
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build runs the readiness gate itself when PUBLIC_APP_ENV is production. The
      # gate must see the Worker secrets to check them, so they are passed to this step
      # only; the deploy never sends them (set them with `wrangler secret put`).
      - name: Build (production, readiness gate)
        if: inputs.environment == 'production'
        env:
          PUBLIC_APP_ENV: production
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RATE_LIMIT_PEPPER: ${{ secrets.RATE_LIMIT_PEPPER }}
          # Normally plain vars in wrangler.jsonc, which the gate reads; a same-named
          # secret is needed only when the site keeps the value as a Worker secret.
          TURNSTILE_ALLOWED_HOSTS: ${{ secrets.TURNSTILE_ALLOWED_HOSTS }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          INQUIRY_TO_EMAIL: ${{ secrets.INQUIRY_TO_EMAIL }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
        run: |
          set -euo pipefail
          # An unset secret or variable arrives as an empty string, which would hide the
          # same value in wrangler.jsonc vars from the gate.
          for name in PUBLIC_GA_MEASUREMENT_ID PUBLIC_GOOGLE_SITE_VERIFICATION \
            PUBLIC_BING_SITE_VERIFICATION TURNSTILE_ALLOWED_HOSTS RESEND_FROM_EMAIL \
            INQUIRY_TO_EMAIL AIRTABLE_BASE_ID AIRTABLE_TABLE_NAME UPSTASH_REDIS_REST_URL; do
            [ -n "${!name}" ] || unset "$name"
          done
          npm run build

      # Builds the preview Worker's config (CLOUDFLARE_ENV) as an experiment, noindex site.
      - name: Build (preview)
        if: inputs.environment == 'preview'
        env:
          CLOUDFLARE_ENV: preview
          PUBLIC_APP_ENV: experiment
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build -- --mode preview

      # dist/server/wrangler.json, written by the build, already names the preview or
      # production Worker: no --env. The locked Wrangler from package-lock.json, never a
      # downloaded one.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no -- wrangler deploy

      - name: Smoke check the live site
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: node scripts/deploy-smoke.mjs "$PUBLIC_SITE_URL"

      - name: Summary
        if: always()
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Deploy ${DEPLOY_ENVIRONMENT}: ${JOB_STATUS}"
            echo "- Commit: ${GITHUB_SHA} (${GITHUB_REF_NAME})"
            echo "- Site: ${PUBLIC_SITE_URL}"
            echo "- The smoke check does not prove which version is served, that Worker secrets"
            echo "  are bound or that inquiries are delivered (LAUNCH.md section 8)."
          } >> "$GITHUB_STEP_SUMMARY"
